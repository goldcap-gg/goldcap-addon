name: Addon CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1
        with:
          args: GoldCap spec --config .luacheckrc

  busted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: busted
