name: Addon CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1
        with:
          args: GoldCap spec --config .luacheckrc

  busted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4
      - run: luarocks install busted
      - run: busted

  # The release announcement carries its own copy of the CurseForge URL — a
  # workflow cannot import a constant — and it once carried the wrong one:
  # `/goldcap` rather than `/goldcap-gg`. That slug belongs to an unrelated
  # addon abandoned in 2014, so every release told the Discord server to go
  # look at a stranger's dead project. Nothing failed; the link simply worked
  # and pointed somewhere else. This compares it against the listing link in
  # the README, which is the one a human actually checks.
  announce-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The release announcement links to our own listing
        run: |
          set -euo pipefail
          announced=$(grep -oE 'https://www\.curseforge\.com/wow/addons/[a-z0-9-]+' \
            .github/workflows/addon-release.yml | sort -u)
          documented=$(grep -oE 'https://www\.curseforge\.com/wow/addons/[a-z0-9-]+' \
            README.md | sort -u)
          echo "announced: $announced"
          echo "README:    $documented"
          [ -n "$announced" ] || { echo "::error::addon-release.yml announces no CurseForge URL"; exit 1; }
          [ "$announced" = "$documented" ] \
            || { echo "::error::the announced listing and the README's disagree"; exit 1; }
