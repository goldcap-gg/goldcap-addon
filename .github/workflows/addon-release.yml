name: Addon Release
on:
  push:
    tags: ["addon-v*"]
  workflow_dispatch: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The bundled snapshot is what a player sees before they install the companion.
      # Regenerating it by hand was the plan and it did not survive contact with reality:
      # 0.4.0 shipped a table built on 2026-07-04 whose eu region was empty. Fetch it at
      # release time and fail the release rather than ship a bad one -- a silently empty
      # table is worse than no release at all.
      - name: Refresh the bundled market snapshot
        run: |
          set -euo pipefail
          out=GoldCap/Data/MarketData.lua
          curl --fail --show-error --silent --max-time 300 \
            https://api.goldcap.gg/v1/addon/market-data -o "$out.new"
          for region in us eu kr tw; do
            grep -q "^  $region = { ts = [1-9]" "$out.new" \
              || { echo "::error::bundled snapshot: $region is missing or has ts = 0"; exit 1; }
          done
          bytes=$(wc -c < "$out.new")
          [ "$bytes" -gt 100000 ] \
            || { echo "::error::bundled snapshot is only $bytes bytes"; exit 1; }
          # And an upper bound, because the table stays in the player's Lua heap for the
          # whole session -- importing does not free it. Measured: the shipped 0.4.0 file
          # was 39.6 bytes per row, and ITEM_CAP_PER_REGION (apps/api/src/lib/
          # addonMarketData.ts) caps only the item half of each region, so four regions at
          # the cap plus their uncapped commodity rows is several megabytes. Warn early so
          # the number lands in the release log with a real payload behind it; fail only
          # where the size is indefensible for a snapshot that is a fossil on arrival.
          [ "$bytes" -lt 6291456 ] \
            || { echo "::error::bundled snapshot is $bytes bytes; lower ITEM_CAP_PER_REGION"; exit 1; }
          [ "$bytes" -lt 2097152 ] \
            || echo "::warning::bundled snapshot is $bytes bytes; consider lowering ITEM_CAP_PER_REGION"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lua5.1
          luac5.1 -p "$out.new"
          echo "bundled snapshot: $bytes bytes, four regions, parses"
          mv "$out.new" "$out"

      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        with:
          # -t must point at the git checkout root (packager requires
          # "<topdir>/.git" to exist) and GoldCap.toc lives one level down in
          # GoldCap/, so topdir is "." and move-folders (in .pkgmeta) pulls
          # the addon content up to the package root. -d is a dry build: no
          # upload to CurseForge or Wago, which is what makes a
          # workflow_dispatch run safe to use as a rehearsal.
          args: ${{ github.event_name == 'workflow_dispatch' && '-d -t . -m .pkgmeta -r ./.release' || '-t . -m .pkgmeta -r ./.release' }}
      # include-hidden-files, or this uploads nothing: packager writes into
      # `.release/`, and upload-artifact v4+ skips hidden paths by default —
      # it warned and moved on, so a dry run produced no zip to look at, which
      # is the only thing a dry run is for. if-no-files-found: error so the
      # next way this breaks is red instead of quiet.
      # The `mirror` job below takes the zip from here. On a tag this step runs after the
      # packager has published, so a hiccup of the artifact service must not fail the job:
      # that would skip the Discord post and make `gh run rerun --failed` publish the same
      # version to CurseForge a second time. The mirror job then fails alone, and is rerun
      # alone. A dry run keeps the failure, it is what tells that no zip was built.
      - uses: actions/upload-artifact@v7
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: goldcap-addon
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

      # The announcement said a new build exists and nothing about what is IN it,
      # which is the only part a player reads -- so #changelog carried a release
      # nobody could tell apart from the last one. The notes already exist: the
      # addon's own CHANGELOG.md, whose top section is this release.
      - name: Read this release's notes
        if: startsWith(github.ref, 'refs/tags/addon-v')
        id: notes
        run: |
          set -euo pipefail
          # Everything from the first "## " heading to the line before the next
          # one, the heading itself dropped -- the version is already the embed's
          # title, and repeating it wastes the first line of the card.
          body=$(awk '/^## /{n++; if (n == 2) exit} n == 1' GoldCap/CHANGELOG.md | tail -n +2)
          # Discord rejects the whole payload over 4096 characters in a description,
          # so a long release would post NOTHING rather than post too much. Trim on a
          # line boundary well under it and say the notes continue.
          if [ "${#body}" -gt 3400 ]; then
            body=$(printf '%s' "$body" | head -c 3400 | sed '$d')
            body="$body"$'\n'"…"
          fi
          body="$body"$'\n\n'"Live on CurseForge and Wago. The companion app updates it for you; otherwise grab it from your addon manager."
          {
            echo 'body<<GOLDCAP_NOTES_EOF'
            printf '%s\n' "$body"
            echo 'GOLDCAP_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Tag pushes only: a workflow_dispatch run is a dry build (-d), and
      # announcing one as a release would be a lie.
      - name: Announce in Discord
        if: startsWith(github.ref, 'refs/tags/addon-v')
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          status: success
          title: "Addon ${{ github.ref_name }}"
          # goldcap-gg, not goldcap: the bare slug belongs to an unrelated
          # addon abandoned in 2014, so this link sent every release
          # announcement to a stranger's dead project. The site repo holds the
          # same URL as a constant, with a test that fails when they drift.
          url: https://www.curseforge.com/wow/addons/goldcap-gg
          # The whole value is one expression on purpose: a multi-line output pasted
          # INTO a block scalar would carry its own newlines past the block's
          # indentation and break the YAML.
          description: ${{ steps.notes.outputs.body }}

  # Puts the release zip and a signed addon.json on goldcap.gg/downloads/addon/, where
  # the Companion looks for the addon to install and update. It needs six repository
  # secrets, the same values the Companion's own release workflow holds: SSH_HOST, SSH_USER
  # and SSH_PRIVATE_KEY (the deploy login; SSH_PORT is optional), TS_OAUTH_CLIENT_ID and
  # TS_OAUTH_SECRET (the box's SSH answers only on the tailnet, as deploy.yml and the
  # Companion's release reach it), and TAURI_SIGNING_PRIVATE_KEY (the Companion's updater
  # key, with TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one). Without all six it builds
  # the manifest unsigned, warns, and uploads nothing; the release above is not affected
  # either way.
  #
  # A job of its own, not steps of `package`, on purpose: `gh run rerun --failed` after
  # a failed upload here reruns only this job. Steps inside `package` would rerun the
  # packager with it and publish the same version to CurseForge and Wago a second time,
  # which they accept as a duplicate.
  #
  # Tags only: a workflow_dispatch rehearsal packages an untagged commit, whose version
  # is a `git describe` string the script rightly refuses, and must never sign a dev build.
  mirror:
    needs: package
    if: startsWith(github.ref, 'refs/tags/addon-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: goldcap-addon
          path: release

      - name: Check publishing secrets
        id: mirror
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] \
              && [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::addon mirror skipped: repository secrets SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET and TAURI_SIGNING_PRIVATE_KEY are not all set"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and sign addon.json
        env:
          # The tag must agree with the TOC; a dry run has no tag to compare.
          ADDON_TAG: ${{ startsWith(github.ref, 'refs/tags/addon-v') && github.ref_name || '' }}
          # Without the key the script writes the manifest unsigned and says so.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.mirror.outputs.have == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.mirror.outputs.have == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          zips=(release/*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one addon zip in release/, found ${#zips[@]}"; exit 1; }
          bash scripts/build-addon-manifest.sh "${zips[0]}" out
          cat out/addon.json

      - uses: actions/upload-artifact@v7
        with:
          name: addon-manifest
          path: out/*
          retention-days: 7
          if-no-files-found: error

      # Same tailnet-only SSH path as deploy.yml and the Companion's release: the box's
      # public port 22 is closed.
      - name: Connect to Tailscale
        if: startsWith(github.ref, 'refs/tags/addon-v') && steps.mirror.outputs.have == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The first addon release makes the folder; later ones find it there.
      - name: Ensure the addon folder exists on the VPS
        if: startsWith(github.ref, 'refs/tags/addon-v') && steps.mirror.outputs.have == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: mkdir -p /opt/wow-auction/downloads/addon

      # The zip goes up first, so addon.json never names a file that is not there yet.
      - name: Upload the zip
        if: startsWith(github.ref, 'refs/tags/addon-v') && steps.mirror.outputs.have == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "out/GoldCap-addon-v*.zip"
          target: /opt/wow-auction/downloads/addon
          strip_components: 1
          overwrite: true

      - name: Upload the manifest
        if: startsWith(github.ref, 'refs/tags/addon-v') && steps.mirror.outputs.have == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "out/addon.json,out/addon.json.sig"
          target: /opt/wow-auction/downloads/addon
          strip_components: 1
          overwrite: true

      # pipefail: GitHub's default shell is `bash -e` without it, so a failed curl at the
      # head of a pipe would be hidden. The cache-busting query keeps the check on the
      # origin, as the Companion's release workflow does: /downloads/ is served with
      # max-age=300.
      - name: Smoke test
        if: startsWith(github.ref, 'refs/tags/addon-v') && steps.mirror.outputs.have == 'true'
        run: |
          set -euo pipefail
          bust="cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="https://goldcap.gg/downloads/addon"
          ver="${GITHUB_REF_NAME#addon-v}"
          json=$(curl -fsS -H 'Cache-Control: no-cache' "$base/addon.json?$bust")
          got=$(jq -r .version <<< "$json")
          [ "$got" = "$ver" ] || { echo "::error::addon.json says $got, expected $ver"; exit 1; }
          curl -fsSI -H 'Cache-Control: no-cache' "$base/addon.json.sig?$bust" | head -n 1
          want=$(jq -r .sha256 <<< "$json")
          url=$(jq -r .url <<< "$json")
          curl -fsS -H 'Cache-Control: no-cache' "$url?$bust" -o served.zip
          have=$(sha256sum served.zip | cut -d' ' -f1)
          [ "$have" = "$want" ] || { echo "::error::served zip is $have, addon.json says $want"; exit 1; }
          echo "addon $ver is live: $url"
